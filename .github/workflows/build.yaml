name: Build Installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        type: string
      description:
        description: 'Release Notes'
        default: 'Fixes'
        type: string

jobs:
  build:
    name: Build the Inno Setup Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Read current version from pubspec.yaml
        id: read_version
        run: |
          $content = Get-Content pubspec.yaml
          $versionLine = $content | Where-Object { $_ -match '^version:' }
          if ($versionLine -match 'version:\s*([\d\.]+)') {
            echo "CURRENT_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          } else {
            echo "No version found!"
            exit 1
          }

      - name: Update pubspec.yaml if version changed
        if: env.CURRENT_VERSION != github.event.inputs.version
        run: |
          Write-Host "Version has changed from $env:CURRENT_VERSION to ${{ github.event.inputs.version }}."
          $pubspec = Get-Content pubspec.yaml
          $updated = $pubspec -replace '^version: .+', "version: ${{ github.event.inputs.version }}+1"
          Set-Content pubspec.yaml $updated

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows/setup.iss
          options: "/O+ \"/DMyAppVersion=${{ github.event.inputs.version }}\""

      - name: Zip portable windows build
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\out\brachydium_searcher_win_portable.zip

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android APK
        run: flutter build apk --release

      - name: Add windows update item
        if: env.CURRENT_VERSION != github.event.inputs.version
        run: |
          $file = Get-ChildItem build/windows/out/*.exe | Select-Object -First 1
          .\update\update-appcast.ps1 `
            -Version "${{ github.event.inputs.version }}" `
            -Description "${{ github.event.inputs.description }}" `
            -OS "windows" `
            -File "$($file.Name)" `
            -Length "$($file.Length)" `
            -Type "application/octet-stream"

      - name: Add android update item
        if: env.CURRENT_VERSION != github.event.inputs.version
        run: |
          $file = Get-ChildItem build/app/outputs/apk/release/*.apk | Select-Object -First 1
          .\update\update-appcast.ps1 `
            -Version "${{ github.event.inputs.version }}" `
            -Description "${{ github.event.inputs.description }}" `
            -OS "android" `
            -File "$($file.Name)" `
            -Length "$($file.Length)" `
            -Type "application/vnd.android.package-archive"

      - name: Commit and push pubspec.yaml and appcast.xml
        if: env.CURRENT_VERSION != github.event.inputs.version # only push new version if it's not already updated
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Bump version to ${{ github.event.inputs.version }}"
          commit_options: "--no-verify"
          file_pattern: "pubspec.yaml update/appcast.xml"
          tagging_message: "v${{ github.event.inputs.version }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          token: ${{ secrets.PAT }}
          name: Brachydium Searcher v${{ github.event.inputs.version }}
          files: |
            build/windows/out/*.exe
            build/windows/out/*.zip
            build/app/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
